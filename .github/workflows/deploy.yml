name: Build & Deploy

on:
  push:
    branches: [main]
  schedule:
    # Poll every 10 min: a ~230-byte /info version check stops the run when
    # both JP and NA hashes are unchanged; otherwise the Atlas API is
    # ETag-revalidated (304 = ~0 bytes) and the build is skipped when no data
    # changed, so idle runs are near-free.
    - cron: '*/10 * * * *'
  workflow_dispatch:
    inputs:
      force_sync:
        description: 'Force re-sync all servant data'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      DEPLOY: ${{ steps.data_change.outputs.DEPLOY }}
      # Whether to run the SYNC at all (pre-decision); the post-sync DEPLOY
      # (build/upload) is decided separately in the data-change step. Each is a
      # single-source output so the decisions can't drift across steps (they
      # historically could — see "actually stop idle schedule runs").
      DO_WORK: ${{ steps.do_work.outputs.DO_WORK }}
    steps:
      - uses: actions/checkout@v4

      # Restore cached images and API payloads
      - name: Restore Atlas Data & Asset Cache
        uses: actions/cache@v4
        with:
          path: |
            .cache/atlas/
            public/servants/
            public/craft_essences/
            src/scripts/data/
          # Primary key only (no restore-keys): when the sync script changes we
          # want a fully clean rebuild, not the previous script version's blob.
          # This blob holds regenerable bytes only: downloaded images, the raw
          # API JSON + ETags under .cache/atlas/, and the generated
          # src/scripts/data/ JS (so the drift path revalidates in place). The
          # gate's comparison baselines do NOT live here: actions/cache never
          # re-saves a blob on an exact-key hit, so state that changes with the
          # game data would freeze at the value from the last miss — the
          # "CHECK=CHANGED forever" failure that made runs #60/#61 (2026-10-20)
          # redo the full sync. They live in .ci-baselines/, round-tripped by
          # the run-scoped restore/save pair below.
          key: fgo-atlas-cache-${{ runner.os }}-${{ hashFiles('scripts/sync_atlas_data.py') }}

      # Baselines must persist even when the asset cache HITS, so they sit in a
      # cache keyed on github.run_id: every run misses the primary key (the
      # save below always writes) and restore-keys fetches the newest one.
      # First run on a branch: no match → files missing → gate yields CHANGED →
      # saved. Self-healing.
      - name: Restore version baselines
        uses: actions/cache/restore@v4
        with:
          path: .ci-baselines/
          key: fgo-version-baseline-${{ github.run_id }}
          restore-keys: fgo-version-baseline-

      # ~230-byte GET /info vs cached JP + NA hashes; idle schedule/dispatch runs stop on UNCHANGED.
      # python3 is preinstalled on the runner; failures yield UNKNOWN and continue.
      - name: Check Atlas data version
        id: data_version
        run: |
          FORCE_FLAG="${{ github.event.inputs.force_sync == 'true' && '--force' || '' }}"
          python3 scripts/check_data_version.py $FORCE_FLAG

      # Decide once whether to run the SYNC. (The post-sync build/deploy decision
      # is DEPLOY, computed separately in the data-change step.)
      #   - push:            always (a push to main is a real deploy)
      #   - schedule:        only if the Atlas version changed (idle poll stops)
      #   - workflow_dispatch: only if force_sync is on OR the version changed (CHECK != UNCHANGED)
      # check_data_version.py is called with --force when force_sync is set, so
      # CHECK is CHANGED whenever work is wanted; DO_WORK therefore collapses to
      # (push) OR (CHECK != UNCHANGED). A single source of truth keeps every
      # step's gate consistent — the decision can't drift between steps.
      - name: Decide whether to do work
        id: do_work
        run: |
          EVENT="${{ github.event_name }}"
          CHECK="${{ steps.data_version.outputs.CHECK }}"
          if [ "$EVENT" = "push" ] || [ "$CHECK" != "UNCHANGED" ]; then
            echo "DO_WORK=true" >> "$GITHUB_OUTPUT"
            echo "Doing work (event=$EVENT, check=$CHECK)."
          else
            echo "DO_WORK=false" >> "$GITHUB_OUTPUT"
            echo "Atlas data unchanged and no force requested (event=$EVENT). Nothing to do."
          fi

      # Every step below is skipped when DO_WORK=false (idle poll / no-force dispatch)
      - name: Set up Python
        if: steps.do_work.outputs.DO_WORK == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        if: steps.do_work.outputs.DO_WORK == 'true'
        run: pip install Pillow

      - uses: actions/setup-node@v4
        if: steps.do_work.outputs.DO_WORK == 'true'
        with:
          node-version: 22
          cache: npm

      - run: npm ci
        if: steps.do_work.outputs.DO_WORK == 'true'

      # Run sync: regenerates game data from Atlas API (using cached images & raw JSON).
      # The generated JS is NOT wiped here: it survives in the cache, so the
      # incremental path (append new / replace drifted entries) runs instead of a
      # full regen. A sync-script format change rotates the cache key and starts clean.
      - name: Sync latest game data from Atlas Academy
        if: steps.do_work.outputs.DO_WORK == 'true'
        run: |
          FORCE_FLAG="${{ github.event.inputs.force_sync == 'true' && '--force' || '' }}"
          python3 scripts/sync_atlas_data.py $FORCE_FLAG

      # Compare generated data hash vs last run; gate the build on it
      - name: Check if generated data changed
        id: data_change
        if: steps.do_work.outputs.DO_WORK == 'true'
        run: |
          mkdir -p .ci-baselines
          HASH_FILE=".ci-baselines/data_hash.txt"
          NEW_HASH=$(cat src/scripts/data/servants.js src/scripts/data/craft_essences.js src/scripts/data/traits.js | sha256sum | cut -d' ' -f1)
          DIRTY=true
          if [ -f "$HASH_FILE" ] && [ "$(cat "$HASH_FILE")" = "$NEW_HASH" ]; then
            DIRTY=false
            echo "Generated data unchanged since last run."
          else
            echo "$NEW_HASH" > "$HASH_FILE"
            echo "Generated data changed (or first run)."
          fi
          echo "DATA_DIRTY=$DIRTY" >> "$GITHUB_OUTPUT"
          # Deploy when ANY of:
          #   - push:          a push to main is a real ship, data or not
          #   - force_sync:    an explicit manual "force a real build/deploy"
          #   - data changed:  a schedule/dispatch run whose sync produced a diff
          # This step only runs when DO_WORK is true (else the sync never
          # happened), so the "version changed but data byte-identical" edge
          # still skips. DEPLOY is computed ONCE here — the build/upload steps
          # below just read it, so the decision can't drift between them.
          if [ "${{ github.event_name }}" = "push" ] \
             || [ "${{ github.event.inputs.force_sync }}" = "true" ] \
             || [ "$DIRTY" = "true" ]; then
            echo "DEPLOY=true" >> "$GITHUB_OUTPUT"
          else
            echo "DEPLOY=false" >> "$GITHUB_OUTPUT"
          fi

      # Bare-form `if` (no ${{ }} wrapper): matches every other gated step in
      # this file, and scripts/test_deploy_workflow.py's would_run() evaluates
      # the stored condition string as-is.
      - name: Save version baselines
        if: github.event_name == 'push' || steps.data_version.outputs.CHECK == 'CHANGED' || steps.data_change.outputs.DATA_DIRTY == 'true'
        uses: actions/cache/save@v4
        with:
          path: .ci-baselines/
          key: fgo-version-baseline-${{ github.run_id }}

      # Verify schema and image consistency (only when building)
      - name: Validate data integrity
        if: steps.data_change.outputs.DEPLOY == 'true'
        run: node scripts/validate_data.js

      - name: Build
        if: steps.data_change.outputs.DEPLOY == 'true'
        run: npm run build

      - name: Verify build outputs
        if: steps.data_change.outputs.DEPLOY == 'true'
        run: |
          if [ ! -f "dist/index.html" ]; then
            echo "ERROR: dist/index.html not found after build"
            exit 1
          fi
          echo "Build outputs verified"

      - name: Upload Pages artifact
        if: steps.data_change.outputs.DEPLOY == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    # Skip on clean schedule runs (no build, no artifact) — deploy-pages would fail
    if: needs.build.result == 'success' && needs.build.outputs.DEPLOY == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # Runs the self-check suites (data-version gate, workflow gate model, and
  # servant drift detection) so a broken config or logic lands red. Skipped on
  # the idle 10-min schedule so polls stay near-free; push/dispatch are code
  # changes, so they always run it. Independent of the build/deploy path — it
  # gates nothing via `needs` (that would break schedule deploys on a skipped
  # job); a red here flags the change while the build's validate_data.js still
  # guards data integrity.
  self-test:
    if: ${{ github.event_name != 'schedule' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyyaml
      - name: Run self-check suites
        run: |
          python3 scripts/test_check_data_version.py
          python3 scripts/test_deploy_workflow.py
          python3 scripts/test_drift.py