name: Build & Deploy

on:
  push:
    branches: [main]
  schedule:
    # Daily run at 02:00 UTC to capture new JP/NA banners
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      force_sync:
        description: 'Force re-sync all servant data'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install Pillow

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Restore cached images and API payloads
      - name: Restore Atlas Data & Asset Cache
        uses: actions/cache@v4
        with:
          path: |
            .cache/atlas/
            public/servants/
            public/craft_essences/
          key: fgo-atlas-cache-${{ runner.os }}-${{ hashFiles('scripts/sync_atlas_data.py') }}
          restore-keys: |
            fgo-atlas-cache-${{ runner.os }}-

      # Run sync: regenerates game data from Atlas API (using cached images & raw JSON)
      - name: Sync latest game data from Atlas Academy
        run: |
          FORCE_FLAG="${{ github.event.inputs.force_sync == 'true' && '--force' || '' }}"
          rm -f src/scripts/data/*.js
          python3 scripts/sync_atlas_data.py $FORCE_FLAG

      # Verify schema and image consistency
      - name: Validate data integrity
        run: node scripts/validate_data.js

      - run: npm run build

      - name: Verify build outputs
        run: |
          if [ ! -f "dist/index.html" ]; then
            echo "ERROR: dist/index.html not found after build"
            exit 1
          fi
          echo "Build outputs verified"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4