name: Build & Deploy
run-name: ${{ inputs.run_label || format('Build & Deploy ({0})', github.event_name) }}

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_sync:
        description: 'Force re-sync all servant data'
        required: false
        type: boolean
        default: false
      run_label:
        description: 'Optional display name for this run (e.g. Data Update 2026-11 #1)'
        required: false
        type: string
        default: ''

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      DEPLOY: ${{ steps.data_change.outputs.DEPLOY }}
      # Whether to run the SYNC at all (pre-decision); the post-sync DEPLOY
      # (build/upload) is decided separately in the data-change step. Each is a
      # single-source output so the decisions can't drift across steps (they
      # historically could — see "actually stop idle schedule runs").
      DO_WORK: ${{ steps.do_work.outputs.DO_WORK }}
    steps:
      - uses: actions/checkout@v7

      # Baselines must persist even when the asset cache HITS, so they sit in a
      # cache keyed on github.run_id + run_attempt (unique per attempt: a
      # re-run would otherwise collide with its own saved key, and cache/save
      # hard-fails on an existing key): every run misses the primary key (the
      # save step, when it runs, always writes) and restore-keys fetches the
      # newest one. First run on a branch: no match → files missing → gate
      # yields CHANGED → saved. Self-healing.
      - name: Restore version baselines
        uses: actions/cache/restore@v6
        with:
          path: .ci-baselines/
          key: fgo-version-baseline-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: fgo-version-baseline-

      # ~230-byte GET /info vs cached JP + NA hashes; idle dispatch runs stop on UNCHANGED.
      # python3 is preinstalled on the runner; failures yield UNKNOWN and continue.
      - name: Check Atlas data version
        id: data_version
        run: |
          FORCE_FLAG="${{ github.event.inputs.force_sync == 'true' && '--force' || '' }}"
          python3 scripts/check_data_version.py --check-shop $FORCE_FLAG

      # Decide once whether to run the SYNC. (The post-sync build/deploy decision
      # is DEPLOY, computed separately in the data-change step.)
      #   - push:            always (a push to main is a real deploy)
      #   - workflow_dispatch: only if force_sync is on OR the version changed (CHECK != UNCHANGED)
      # check_data_version.py is called with --force when force_sync is set, so
      # CHECK is CHANGED whenever work is wanted; DO_WORK therefore collapses to
      # (push) OR (CHECK != UNCHANGED). A single source of truth keeps every
      # step's gate consistent — the decision can't drift between steps.
      - name: Decide whether to do work
        id: do_work
        run: |
          EVENT="${{ github.event_name }}"
          CHECK="${{ steps.data_version.outputs.CHECK }}"
          if [ "$EVENT" = "push" ] || [ "$CHECK" != "UNCHANGED" ]; then
            echo "DO_WORK=true" >> "$GITHUB_OUTPUT"
            echo "Doing work (event=$EVENT, check=$CHECK)."
          else
            echo "DO_WORK=false" >> "$GITHUB_OUTPUT"
            echo "Atlas data unchanged and no force requested (event=$EVENT). Nothing to do."
          fi

      # Restore cached generated outputs only when doing work.
      # Keyed on sync scripts + version baseline so format/logic edits rebuild cleanly
      # while new game versions incrementally restore prior outputs and re-save under the new key.
      - name: Restore Atlas Data & Asset Cache
        id: atlas_cache
        if: steps.do_work.outputs.DO_WORK == 'true'
        uses: actions/cache@v6
        with:
          path: |
            public/servant_info/
            src/scripts/data/
          key: fgo-atlas-cache-${{ runner.os }}-${{ hashFiles('scripts/sync_atlas_data.py', 'scripts/fetch_bordered_ces.py', 'scripts/servant_info_converter/*.py') }}-${{ hashFiles('.ci-baselines/data_version.txt') }}
          restore-keys: |
            fgo-atlas-cache-${{ runner.os }}-${{ hashFiles('scripts/sync_atlas_data.py', 'scripts/fetch_bordered_ces.py', 'scripts/servant_info_converter/*.py') }}-

      # Dedicated raw Atlas API cache: keyed only on game data version so Python edits reuse ETag-validated JSONs
      # while game updates (rank ups, new costumes, new traits) still revalidate via If-None-Match (304/200).
      - name: Restore Atlas Raw API Cache
        if: steps.do_work.outputs.DO_WORK == 'true'
        uses: actions/cache@v6
        with:
          path: .cache/atlas/
          key: fgo-atlas-raw-v1-${{ runner.os }}-${{ hashFiles('.ci-baselines/data_version.txt') }}
          restore-keys: |
            fgo-atlas-raw-v1-${{ runner.os }}-

      # Dedicated static image cache: keyed only on game data version so Python edits never re-download icons.
      # actions/cache hashes `path:` into its internal version, so give future asset dirs their own cache step instead of editing this list.
      - name: Restore Static Image Cache
        id: static_img_cache
        if: steps.do_work.outputs.DO_WORK == 'true'
        uses: actions/cache@v6
        with:
          path: |
            public/servants/
            public/craft_essences/
            public/skill_icons/
            public/event_shop/
          key: fgo-static-images-v2-${{ runner.os }}-${{ hashFiles('.ci-baselines/data_version.txt') }}
          restore-keys: |
            fgo-static-images-v2-${{ runner.os }}-

      # Dedicated Saint Graph cache: keyed only on game data version so Python edits never re-download images.
      - name: Restore Saint Graph Cache
        id: saint_graph_cache
        if: steps.do_work.outputs.DO_WORK == 'true'
        uses: actions/cache@v6
        with:
          path: public/saint_graphs/
          key: fgo-saint-graphs-v1-${{ runner.os }}-${{ hashFiles('.ci-baselines/data_version.txt') }}
          restore-keys: fgo-saint-graphs-v1-${{ runner.os }}-

      # Dedicated Buff Icon cache: keyed only on game data version so Python edits never re-download icons.
      - name: Restore Buff Icon Cache
        id: buff_icon_cache
        if: steps.do_work.outputs.DO_WORK == 'true'
        uses: actions/cache@v6
        with:
          path: public/buff_icons/
          key: fgo-buff-icons-v1-${{ runner.os }}-${{ hashFiles('.ci-baselines/data_version.txt') }}
          restore-keys: fgo-buff-icons-v1-${{ runner.os }}-

      # Every step below is skipped when DO_WORK=false (idle poll / no-force dispatch)
      - name: Set up Python
        if: steps.do_work.outputs.DO_WORK == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        if: steps.do_work.outputs.DO_WORK == 'true'
        run: pip install Pillow

      # Run sync: regenerates game data from Atlas API (using cached images & raw JSON).
      # The generated JS is NOT wiped here: it survives in the cache, so the
      # incremental path (append new / replace drifted entries) runs instead of a
      # full regen. A sync-script format change rotates the cache key and starts clean.
      - name: Sync latest game data from Atlas Academy
        if: steps.do_work.outputs.DO_WORK == 'true'
        run: |
          mkdir -p .ci-baselines
          if [ "${{ steps.data_version.outputs.CHECK }}" = "UNCHANGED" ] \
             && [ "${{ steps.atlas_cache.outputs.cache-hit }}" = "true" ] \
             && [ "${{ steps.static_img_cache.outputs.cache-hit }}" = "true" ] \
             && [ "${{ steps.saint_graph_cache.outputs.cache-hit }}" = "true" ] \
             && [ "${{ steps.buff_icon_cache.outputs.cache-hit }}" = "true" ]; then
            echo "Atlas data unchanged and all data/image caches hit — skipping sync_atlas_data.py."
            exit 0
          fi
          FORCE_FLAG="${{ github.event.inputs.force_sync == 'true' && '--force' || '' }}"
          python3 -u scripts/sync_atlas_data.py $FORCE_FLAG

      # Compare generated data hash vs last run; gate the build on it
      - name: Check if generated data changed
        id: data_change
        if: steps.do_work.outputs.DO_WORK == 'true'
        run: |
          mkdir -p .ci-baselines
          HASH_FILE=".ci-baselines/data_hash.txt"
          # Covers servants.js, craft_essences.js, traits.js, bond_growth.js, event_shop.js (normalized) + public/servant_info/*.json
          NEW_HASH=$(python3 scripts/check_data_version.py --data-hash)
          OLD_HASH=""
          if [ -f "$HASH_FILE" ]; then
            OLD_HASH=$(cat "$HASH_FILE")
          fi
          DIRTY=true
          if [ -n "$OLD_HASH" ] && [ "$OLD_HASH" = "$NEW_HASH" ]; then
            DIRTY=false
            echo "Generated data unchanged since last run (${NEW_HASH:0:12})."
          else
            echo "$NEW_HASH" > "$HASH_FILE"
            echo "Generated data changed (or first run): ${OLD_HASH:0:12} -> ${NEW_HASH:0:12}."
          fi
          echo "DATA_DIRTY=$DIRTY" >> "$GITHUB_OUTPUT"
          # Deploy when ANY of:
          #   - push:          a push to main is a real ship, data or not
          #   - force_sync:    an explicit manual "force a real build/deploy"
          #   - data changed:  a dispatch run whose sync produced a diff
          # This step only runs when DO_WORK is true (else the sync never
          # happened), so the "version changed but data byte-identical" edge
          # still skips. DEPLOY is computed ONCE here — the build/upload steps
          # below just read it, so the decision can't drift between them.
          if [ "${{ github.event_name }}" = "push" ] \
             || [ "${{ github.event.inputs.force_sync }}" = "true" ] \
             || [ "$DIRTY" = "true" ]; then
            echo "DEPLOY=true" >> "$GITHUB_OUTPUT"
          else
            echo "DEPLOY=false" >> "$GITHUB_OUTPUT"
          fi

      # Verify schema and image consistency (only when building)
      - name: Set up Node.js
        uses: actions/setup-node@v7
        if: steps.data_change.outputs.DEPLOY == 'true'
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install Node dependencies
        run: npm ci --omit=dev
        if: steps.data_change.outputs.DEPLOY == 'true'

      - name: Validate data integrity
        if: steps.data_change.outputs.DEPLOY == 'true'
        run: node scripts/validate_data.js

      - name: Build
        if: steps.data_change.outputs.DEPLOY == 'true'
        run: npm run build

      # Chunk layout, <head> order and visible page text are asserted against
      # scripts/build_baseline.json. The browser verifier (tools/verify_render.js)
      # is deliberately not here: it needs a Chromium download, and this workflow
      # runs on the data-poll schedule, so a flaky fetch would block deploys for a
      # reason unrelated to the site. It is a local pre-merge gate instead.
      - name: Check build output
        if: steps.data_change.outputs.DEPLOY == 'true'
        run: npm run check:build

      - name: Verify build outputs
        if: steps.data_change.outputs.DEPLOY == 'true'
        run: |
          if [ ! -f "dist/index.html" ]; then
            echo "ERROR: dist/index.html not found after build"
            exit 1
          fi
          echo "Build outputs verified"

      - name: Upload Pages artifact
        if: steps.data_change.outputs.DEPLOY == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      # Last step: saving earlier would persist the baselines even when a later
      # validate/build step fails, making every later schedule run skip an
      # update that never shipped.
      # Bare-form `if` (no ${{ }} wrapper): matches every other gated step in
      # this file, and scripts/test_deploy_workflow.py's would_run() evaluates
      # the stored condition string as-is.
      - name: Save version baselines
        if: github.event_name == 'push' || steps.data_version.outputs.CHECK == 'CHANGED' || steps.data_change.outputs.DATA_DIRTY == 'true'
        uses: actions/cache/save@v6
        with:
          path: .ci-baselines/
          key: fgo-version-baseline-${{ github.run_id }}-${{ github.run_attempt }}

  deploy:
    needs: build
    # Skip on clean dispatch runs (no build, no artifact) — deploy-pages would fail
    if: needs.build.result == 'success' && needs.build.outputs.DEPLOY == 'true'
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  # Runs the self-check suites (data-version gate, workflow gate model, and
  # servant drift detection) so a broken config or logic lands red. Independent
  # of the build/deploy path — it gates nothing via `needs`; a red here flags
  # the change while the build's validate_data.js still guards data integrity.
  self-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install pyyaml Pillow
      - name: Run self-check suites
        run: |
          python3 scripts/test_check_data_version.py
          python3 scripts/test_deploy_workflow.py
          python3 scripts/test_drift.py
          python3 scripts/test_sync_event_shop.py
          python3 scripts/test_sync_event_shop_adversarial.py
          python3 scripts/test_image_webp_lossless.py
          python3 scripts/test_repro_action_versions.py