name: Build & Deploy

on:
  push:
    branches: [main]
  schedule:
    # Hourly poll: Atlas API is ETag-revalidated (304 = ~0 bytes) and the build
    # is skipped when no data changed, so idle runs are near-free.
    - cron: '13 * * * *'
  workflow_dispatch:
    inputs:
      force_sync:
        description: 'Force re-sync all servant data'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      DEPLOY: ${{ steps.data_change.outputs.DEPLOY }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install Pillow

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Restore cached images and API payloads
      - name: Restore Atlas Data & Asset Cache
        uses: actions/cache@v4
        with:
          path: |
            .cache/atlas/
            public/servants/
            public/craft_essences/
          # Primary key only (no restore-keys): when sync code changes we want a
          # fully clean rebuild, not the previous script version's cache.
          key: fgo-atlas-cache-${{ runner.os }}-${{ hashFiles('scripts/sync_atlas_data.py') }}

      # Run sync: regenerates game data from Atlas API (using cached images & raw JSON)
      - name: Sync latest game data from Atlas Academy
        run: |
          FORCE_FLAG="${{ github.event.inputs.force_sync == 'true' && '--force' || '' }}"
          rm -f src/scripts/data/*.js
          python3 scripts/sync_atlas_data.py $FORCE_FLAG

      # Compare generated data hash vs last run; gate the build on it
      - name: Check if generated data changed
        id: data_change
        run: |
          HASH_FILE=".cache/atlas/data_hash.txt"
          NEW_HASH=$(cat src/scripts/data/servants.js src/scripts/data/craft_essences.js src/scripts/data/traits.js | sha256sum | cut -d' ' -f1)
          DIRTY=true
          if [ -f "$HASH_FILE" ] && [ "$(cat "$HASH_FILE")" = "$NEW_HASH" ]; then
            DIRTY=false
            echo "Generated data unchanged since last run."
          else
            echo "$NEW_HASH" > "$HASH_FILE"
            echo "Generated data changed (or first run)."
          fi
          echo "DATA_DIRTY=$DIRTY" >> "$GITHUB_OUTPUT"
          # Deploy only when a Pages artifact will be uploaded (same gate as the build steps)
          if [ "$GITHUB_EVENT_NAME" != "schedule" ] || [ "$DIRTY" = "true" ]; then
            echo "DEPLOY=true" >> "$GITHUB_OUTPUT"
          else
            echo "DEPLOY=false" >> "$GITHUB_OUTPUT"
          fi

      # Verify schema and image consistency (only when building)
      - name: Validate data integrity
        if: steps.data_change.outputs.DATA_DIRTY == 'true' || github.event_name != 'schedule'
        run: node scripts/validate_data.js

      - name: Build
        if: steps.data_change.outputs.DATA_DIRTY == 'true' || github.event_name != 'schedule'
        run: npm run build

      - name: Verify build outputs
        if: steps.data_change.outputs.DATA_DIRTY == 'true' || github.event_name != 'schedule'
        run: |
          if [ ! -f "dist/index.html" ]; then
            echo "ERROR: dist/index.html not found after build"
            exit 1
          fi
          echo "Build outputs verified"

      - name: Upload Pages artifact
        if: steps.data_change.outputs.DATA_DIRTY == 'true' || github.event_name != 'schedule'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    # Skip on clean schedule runs (no build, no artifact) — deploy-pages would fail
    if: needs.build.result == 'success' && needs.build.outputs.DEPLOY == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4